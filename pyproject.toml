[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-maddpg"
version = "1.0.0"
description = "Multi-agent actor-critic (MADDPG) for the Unity ML-Agents Tennis environment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "imageio>=2.31",
    # Pinned: the vendored ml-agents v0.4 protobuf stubs were generated by
    # protoc 3.5 and are rejected by the protobuf >=4.21 runtime.
    "protobuf==3.20.3",
    "grpcio>=1.60",
]

[project.scripts]
tennis-train = "tennis.cli:main"

[tool.setuptools]
# tennis is ours; unityagents/communicator_objects are the vendored,
# modernised Unity ML-Agents v0.4 client (see docs/PORTING.md).
packages = ["tennis", "unityagents", "communicator_objects"]

[tool.setuptools.package-dir]
tennis = "src/tennis"
unityagents = "vendor/unityagents"
communicator_objects = "vendor/communicator_objects"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # The vendored ml-agents v0.4 protobuf stubs were generated by protoc 3.5
    # and use the legacy unlinked-descriptor API. Expected; see docs/PORTING.md.
    "ignore:Call to deprecated create function.*:DeprecationWarning",
]
