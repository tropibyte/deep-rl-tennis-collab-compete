name: maddpg
algo: ddpg
seed: 2
shared_policy: true
centralised_critic: true
episodes: 2500
max_steps: 1000
update_every: 1
updates_per_cycle: 1
learn_start: 1024
buffer_size: 1000000
batch_size: 256
gamma: 0.99
tau: 0.01
lr_actor: 0.0001
lr_critic: 0.001
weight_decay: 0.0
n_step: 1
grad_clip_critic: 1.0
grad_clip_actor: null
hidden_actor:
- 256
- 128
hidden_critic:
- 256
- 128
norm: layer
input_norm: none
noise:
  kind: ou
  sigma: 0.2
  sigma_min: 0.01
  sigma_decay: 0.999
  theta: 0.15
  mu: 0.0
per:
  enabled: false
  alpha: 0.6
  beta_start: 0.4
  beta_frames: 100000
td3:
  policy_delay: 2
  target_noise: 0.2
  noise_clip: 0.5
score_reduce: max
solve_score: 0.5
solve_window: 100
torch_threads: 1
device: cpu
